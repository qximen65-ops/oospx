<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的網站</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }
    .hero {
      padding: 60px 20px;
      text-align: center;
      background: linear-gradient(135deg, #1f6feb, #4da3ff);
      color: white;
    }
    .hero h1 {
      font-size: 34px;
      margin-bottom: 15px;
    }
    .hero p {
      font-size: 18px;
      line-height: 1.8;
    }
    .section {
      max-width: 900px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #06c755;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>歡迎來到我的網站</h1>
    <p>這裡可以放你的工作介紹、服務內容、聯絡方式。</p>
    <a class="btn" href="https://line.me/R/ti/p/你的LINEID">加入 LINE 了解更多</a>
  </div>

  <div class="section">
    <h2>服務內容</h2>
    <p>這裡可以介紹你的網站內容，例如工作資訊、資金規劃說明、表單填寫、客服聯繫等。</p>
  </div>

</body>
</html>
